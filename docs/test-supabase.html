<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase Connection</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Testing Supabase Connection</h1>
    <div id="result"></div>
    
    <script type="module">
        import { supabase } from './supabase-client.js';
        
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            
            try {
                // Test 1: Get user count
                const { count, error } = await supabase
                    .from('sc_simple_users')
                    .select('*', { count: 'exact', head: true });
                
                if (error) {
                    resultDiv.innerHTML += `<p style="color: red;">Error getting user count: ${error.message}</p>`;
                } else {
                    resultDiv.innerHTML += `<p style="color: green;">User count: ${count}</p>`;
                }
                
                // Test 2: Check auth
                const { data: { user } } = await supabase.auth.getUser();
                resultDiv.innerHTML += `<p>Current user: ${user ? user.email : 'Not logged in'}</p>`;
                
            } catch (err) {
                resultDiv.innerHTML += `<p style="color: red;">Connection error: ${err.message}</p>`;
            }
        }
        
        testConnection();
    </script>
</body>
</html>
